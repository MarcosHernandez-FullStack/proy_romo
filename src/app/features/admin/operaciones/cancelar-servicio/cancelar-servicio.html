<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-[460px] overflow-hidden">

    <!-- Red header -->
    <div class="bg-[#e7000b] px-6 py-5">
      <div class="flex items-center gap-3">
        <lucide-angular [img]="XCircleIcon" class="size-5" color="white" [strokeWidth]="1.5" />
        <div>
          <h2 class="text-white text-[20px] font-bold">Cancelar Servicio</h2>
          <p class="text-[#ffe2e2] text-[13px]">Esta acción no se puede deshacer</p>
        </div>
      </div>
    </div>

    @if (error()) {
      <div class="px-6 pt-4">
        <app-error-banner [mensaje]="error()!" />
      </div>
    }

    <div class="p-6 flex flex-col gap-4">

      <div class="bg-[#f3f4f6] border border-[#e5e7eb] rounded-[10px] px-4 py-3">
        <p class="text-[#364153] text-[13px]">Reserva: <strong class="text-[#101828]">#{{ reserva().id }}</strong></p>
        <p class="text-[#364153] text-[13px]">Origen: <strong class="text-[#101828]">{{ reserva().direccionOrigen }}</strong></p>
        <p class="text-[#364153] text-[13px]">Destino: <strong class="text-[#101828]">{{ reserva().direccionDestino }}</strong></p>
      </div>

      <div>
        <label class="text-[#364153] text-[13px] font-medium mb-1.5 block">Motivo de Cancelación *</label>
        <input type="text" [ngModel]="motivo()" (ngModelChange)="motivo.set($event)" name="motivo"
          maxlength="255"
          placeholder="Indique el motivo..."
          class="w-full border rounded-[10px] px-3 py-2.5 text-[14px] text-[#101828] focus:outline-none focus:border-[#e7000b]"
          [class.border-[#e7000b]]="errores().motivo"
          [class.border-[#fca5a5]]="!errores().motivo" />
        <div class="flex items-center justify-between mt-1">
          <span class="text-[11px]">
            @if (errores().motivo) {
              <span class="text-[#e7000b]">{{ errores().motivo }}</span>
            }
          </span>
          <span class="text-[11px]"
            [class.text-[#e7000b]]="motivo().length >= 230"
            [class.text-[#9ca3af]]="motivo().length < 230">
            {{ motivo().length }}/255
          </span>
        </div>
      </div>

    </div>

    <div class="px-6 py-4 border-t border-[#e5e7eb] flex gap-3">
      <button type="button" (click)="cerrar.emit()"
        class="flex-1 border border-[#d1d5dc] text-[#364153] text-[14px] font-medium rounded-[10px] h-10 hover:bg-[#f9fafb] transition-colors cursor-pointer">
        Volver
      </button>
      <button type="button" (click)="onGuardar()" [disabled]="guardando()"
        class="flex-1 bg-[#e7000b] hover:bg-[#c10007] disabled:opacity-50 disabled:cursor-not-allowed text-white text-[14px] font-semibold rounded-[10px] h-10 transition-colors cursor-pointer">
        {{ guardando() ? 'Cancelando...' : 'Guardar Cancelación' }}
      </button>
    </div>

  </div>
</div>

@if (showConfirmacion()) {
  <app-mensaje-modal
    tipo="advertencia"
    titulo="¿Cancelar reserva #{{ reserva().id }}?"
    [mensaje]="'Al confirmar esta acción:\n\n• El servicio quedará inactivo y no podrá ser retomado.\n• Los bloques de horario quedarán liberados para nuevas reservas.\n• La grúa y el operador asignados quedarán disponibles.\n\nMotivo registrado: ' + motivo()"
    [confirmable]="true"
    labelCancelar="Volver"
    labelConfirmar="Sí, cancelar servicio"
    (cerrar)="showConfirmacion.set(false)"
    (confirmar)="showConfirmacion.set(false); onConfirmar()" />
}
