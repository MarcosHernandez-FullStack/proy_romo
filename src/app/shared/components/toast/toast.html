@if (notif.toast(); as t) {
  <div
    role="alert"
    class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[9999] flex items-start gap-3 px-4 py-3 rounded-xl shadow-lg max-w-sm w-full text-sm"
    [class]="t.tipo === 'error'
      ? 'bg-red-950 border border-red-700 text-red-200'
      : 'bg-yellow-950 border border-yellow-600 text-yellow-200'"
  >
    <span class="text-base leading-5">
      {{ t.tipo === 'error' ? '✕' : '⚠' }}
    </span>
    <p class="flex-1 leading-5">{{ t.mensaje }}</p>
    <button
      (click)="notif.cerrar()"
      class="text-xs opacity-60 hover:opacity-100 leading-5 shrink-0"
    >✕</button>
  </div>
}
